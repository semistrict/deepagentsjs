[package]
name = "deepagents-durable-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The deepagents durable kernel for JavaScript hosts: Node and Cloudflare Durable Objects."

[lib]
crate-type = ["cdylib"]

[dependencies]
durable-core = { git = "https://github.com/semistrict/deepagents", rev = "f787379486e13415551dde4083788135871c0355" }
futures-util = { version = "0.3.34", default-features = false, features = [
  "alloc",
] }
js-sys = "0.3.106"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlite-wasm-rs = "0.5.5"
tokio = { version = "1.53.2", default-features = false, features = ["sync"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"

[profile.release]
lto = true
opt-level = "s"
